name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci_shadow?schema=public

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-node v7.0.0 — same major as the production runtime
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # C1: a migration that drops data needs an explicit approval line.
      - name: Reject unapproved destructive migrations
        run: npm run check:migrations

      - name: Create the shadow database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c \
            'CREATE DATABASE ecommerce_ci_shadow'

      - name: Apply every migration to a fresh database
        run: npx prisma migrate deploy

      # C1: the migration history must build exactly schema.prisma.
      - name: Fail if the schema and the migrations have drifted
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code

      # H1: tsc emits on error, so the typecheck must gate on its own.
      - run: npm run typecheck

      - run: npm run build

      - run: npm run check:logs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
